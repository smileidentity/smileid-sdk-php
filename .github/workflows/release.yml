name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag matches SDK version
    if: github.repository == 'smileidentity/smileid-sdk-php'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare tag to src/Version.php
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -oP "VERSION\s*=\s*'\K[^']+" src/Version.php | head -n1 || true)
          if [ -z "$SRC_VERSION" ]; then
            echo "::error::Could not read SmileIdentity\\Version::VERSION from src/Version.php"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but src/Version.php declares $SRC_VERSION. Update the VERSION constant before tagging."
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches src/Version.php"
      - name: Check CHANGELOG.md has an entry for this version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found at repository root."
            exit 1
          fi
          if ! grep -qF "## [$TAG_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' heading. Add a changelog entry before tagging."
            exit 1
          fi
          echo "CHANGELOG.md has an entry for $TAG_VERSION"
      - name: Check the major version matches breaking PRs
        # A PR merged since the previous tag with the `breaking` label needs a
        # major version bump, and a major bump needs at least one such PR.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname --merged "${GITHUB_REF_NAME}^" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No earlier v* release tag, so there is no version to compare with."
            exit 0
          fi
          PREV_MAJOR="${PREV_TAG#v}"
          PREV_MAJOR="${PREV_MAJOR%%.*}"
          NEW_MAJOR="${TAG_VERSION%%.*}"
          SINCE=$(git log -1 --format=%cI "$PREV_TAG")
          BREAKING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
            --label breaking --search "merged:>=$SINCE" --limit 100 \
            --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [ -n "$BREAKING" ]; then
            echo "PRs labelled breaking merged since $PREV_TAG ($SINCE):"
            echo "$BREAKING"
          else
            echo "No PRs labelled breaking merged since $PREV_TAG ($SINCE)."
          fi
          if [ -n "$BREAKING" ] && [ "$NEW_MAJOR" -le "$PREV_MAJOR" ]; then
            echo "::error::PRs labelled breaking merged since $PREV_TAG, so v$TAG_VERSION must be a new major version (greater than $PREV_MAJOR)."
            exit 1
          fi
          if [ -z "$BREAKING" ] && [ "$NEW_MAJOR" -gt "$PREV_MAJOR" ]; then
            echo "::error::v$TAG_VERSION is a major version bump from $PREV_TAG, but no PR labelled breaking merged since then. Label the breaking PR, or release a minor or patch version."
            exit 1
          fi
          echo "v$TAG_VERSION is consistent with the breaking PRs since $PREV_TAG."

  # composer.json has no "version" field (Packagist infers it from the git
  # tag) so there is nothing to guard there. src/Version.php is the actual
  # source of truth: its VERSION const is sent as the SmileID-Source-SDK-Version
  # header on every request, so it is the value that matters to consumers.

  test:
    name: Full test suite
    needs: guard
    uses: ./.github/workflows/test.yml

  release:
    name: Create GitHub release
    needs: [guard, test]
    if: github.repository == 'smileidentity/smileid-sdk-php'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag $PRERELEASE

  # No publish step: Packagist tracks smileid/usesmileid via a GitHub webhook
  # and picks up new versions from pushed tags automatically. There is no
  # registry credential for this SDK, so there is no secret to guard here.
