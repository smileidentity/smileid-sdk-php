name: e2e

on:
  push:
    branches:
      - main
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'smileidentity/smileid-sdk-php'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run live e2e test
        env:
          SMILE_PARTNER_ID: ${{ secrets.SMILE_PARTNER_ID }}
          SMILE_API_KEY: ${{ secrets.SMILE_API_KEY }}
          SMILE_BASE_URL: ${{ secrets.SMILE_E2E_BASE_URL }}
        run: |
          set -o pipefail
          vendor/bin/phpunit --group e2e | tee e2e-output.txt
          echo "--- summary ---"
          tail -n 5 e2e-output.txt
          # phpunit exits 0 even when the test skips (missing creds), so check
          # the summary line explicitly: a real pass reads "OK (1 test, N
          # assertions)"; a skip reads "OK, but incomplete, skipped, or risky
          # tests!" instead and must fail this job.
          grep -q "OK (1 test" e2e-output.txt
